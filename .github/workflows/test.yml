name: Tests

# The tests run only for a pull request that carries the `release` label (the one that also publishes a release once
# it is merged, see release.yml). Every other pull request gets these jobs as skipped, and a skipped job counts as passed
# for the required checks. Adding the label starts the tests.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  # A pull request that changes only documentation (markdown, the license, the docs folder, the issue templates,
  # the Crowdin configuration) needs no build. `macos` is a required check: when this job finds nothing but documentation,
  # `macos` is skipped, and a skipped job counts as passed.
  changes:
    if: contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A release pull request must raise the version: the release is tagged with it (release.yml).
      - name: Version has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' macos/project.yml | head -1)"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version exists already: raise MARKETING_VERSION in macos/project.yml."
            exit 1
          fi
      - id: diff
        run: |
          # On a pull request the checkout is the merge commit: its first parent is the base.
          if git diff --name-only HEAD^1 HEAD | grep -v -E '\.md$|^LICENSE$|^docs/|^\.github/ISSUE_TEMPLATE/|^crowdin\.yml$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Bundle identifier
        working-directory: macos
        run: cp Config/Local.xcconfig.example Config/Local.xcconfig

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Core tests (no Xcode project needed)
        working-directory: macos
        run: swift test

      - name: App tests
        working-directory: macos
        run: |
          xcodegen generate
          # CI has no signing certificate: sign ad hoc, the tests never launch the app.
          xcodebuild test -project PaneFlip.xcodeproj -scheme PaneFlip -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO
