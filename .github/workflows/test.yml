name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    # PaneFlip targets macOS 27, newer than any hosted runner. CI builds against macOS 26 by lowering the
    # deployment target in the checkout only (first step below); the repository files keep 27.0.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Lower deployment target for CI
        working-directory: macos
        run: |
          sed -i '' 's/macOS("27.0")/macOS("26.0")/' Package.swift
          sed -i '' 's/macOS: "27.0"/macOS: "26.0"/' project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Core tests (no Xcode project needed)
        working-directory: macos
        run: swift test

      - name: App tests
        working-directory: macos
        run: |
          xcodegen generate
          # CI has no signing certificate: sign ad hoc, the tests never launch the app.
          xcodebuild test -project PaneFlip.xcodeproj -scheme PaneFlip -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO
