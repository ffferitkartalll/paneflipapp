name: Tests

on:
  pull_request:

jobs:
  # A pull request that changes only documentation (markdown, the license, the issue templates, the Crowdin
  # configuration) needs no build. `macos` is a required check: when this job finds nothing but documentation,
  # `macos` is skipped, and a skipped job counts as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          # On a pull request the checkout is the merge commit: its first parent is the base.
          if git diff --name-only HEAD^1 HEAD | grep -v -E '\.md$|^LICENSE$|^\.github/ISSUE_TEMPLATE/|^crowdin\.yml$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # PaneFlip targets macOS 27, newer than any hosted runner. CI builds against macOS 26 by lowering the
    # deployment target in the checkout only (first step below); the repository files keep 27.0.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Lower deployment target for CI
        working-directory: macos
        run: |
          sed -i '' 's/macOS("27.0")/macOS("26.0")/' Package.swift
          sed -i '' 's/"27.0"/"26.0"/' project.yml

      - name: Bundle identifier
        working-directory: macos
        run: cp Config/Local.xcconfig.example Config/Local.xcconfig

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Core tests (no Xcode project needed)
        working-directory: macos
        run: swift test

      - name: App tests
        working-directory: macos
        run: |
          xcodegen generate
          # CI has no signing certificate: sign ad hoc, the tests never launch the app.
          xcodebuild test -project PaneFlip.xcodeproj -scheme PaneFlip -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO
