name: Release

# A release is published when a pull request with the `release` label is merged into main, never for any other merge.
# That pull request also ran the tests (test.yml). Its version comes from MARKETING_VERSION in macos/project.yml: the
# pull request raises it, the release is tagged `v<version>`, and a version that already has a release stops the job.
# Its notes list the issues the merged pull requests closed (not the pull requests), made in the step before Publish.
# Last, the cask in ffferitkartalll/homebrew-tap gets the new version (secret TAP_TOKEN: contents write on that repository).
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Version
        id: version
        working-directory: macos
        run: |
          version="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml | head -1)"
          [ -n "$version" ] || { echo "No MARKETING_VERSION in project.yml"; exit 1; }
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version exists already: raise MARKETING_VERSION in the pull request."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bundle identifier
        working-directory: macos
        run: |
          echo "PANEFLIP_BUNDLE_ID = ${{ vars.PANEFLIP_BUNDLE_ID }}" > Config/Local.xcconfig

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        working-directory: macos
        run: |
          xcodegen generate
          # Signed afterwards with the release certificate (next steps): the build itself does not sign.
          xcodebuild build -project PaneFlip.xcodeproj -scheme PaneFlip -configuration Release \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Import the signing certificate
        env:
          RELEASE_CERT_P12: ${{ secrets.RELEASE_CERT_P12 }}
          RELEASE_CERT_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$RELEASE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$RELEASE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          rm "$RUNNER_TEMP/release.p12"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign and pack
        run: |
          app="$RUNNER_TEMP/build/Build/Products/Release/PaneFlip.app"
          # The same certificate for every release keeps the app's identity, so the permissions macOS gave it stay.
          codesign --force --sign "PaneFlip Release" --keychain "$KEYCHAIN" "$app"
          codesign --verify --strict "$app"
          mkdir "$RUNNER_TEMP/dmg"
          cp -R "$app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname PaneFlip -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO \
            "PaneFlip-${{ steps.version.outputs.version }}.dmg"

      - name: Release notes
        run: |
          previous="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')"
          repo="${{ github.repository }}"
          version="${{ steps.version.outputs.version }}"
          # The pull requests merged since the previous release: each squash commit's first line ends with (#number).
          numbers="$(gh api "repos/$repo/compare/$previous...${{ github.event.pull_request.merge_commit_sha }}" --paginate \
            --jq '.commits[].commit.message | split("\n")[0] | capture("\\(#(?<n>[0-9]+)\\)$").n')"
          # The issues those pull requests closed, except those of a release pull request, the documentation-only ones and the ones
          # labelled internal.
          for number in $numbers; do
            gh api graphql -f owner="${repo%/*}" -f name="${repo#*/}" -F number="$number" -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    labels(first: 20) { nodes { name } }
                    closingIssuesReferences(first: 50) { nodes { number title labels(first: 20) { nodes { name } } } }
                  }
                }
              }' --jq '.data.repository.pullRequest
                | select(([.labels.nodes[].name] | index("release")) == null)
                | .closingIssuesReferences.nodes[]
                | select([.labels.nodes[].name] != ["documentation"] and (.labels.nodes | map(.name) | index("internal")) == null)
                | "\(.number)\t\(.title)"'
          done | sort -n -u > "$RUNNER_TEMP/issues.tsv"
          {
            echo "## What's new"
            echo
            if [ -s "$RUNNER_TEMP/issues.tsv" ]; then
              awk -F'\t' '{ printf "* %s (#%s)\n", $2, $1 }' "$RUNNER_TEMP/issues.tsv"
            else
              echo "* Small fixes and improvements."
            fi
            echo
            echo "**Full Changelog**: https://github.com/$repo/compare/$previous...v$version"
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish
        run: |
          gh release create "v${{ steps.version.outputs.version }}" "PaneFlip-${{ steps.version.outputs.version }}.dmg" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "PaneFlip ${{ steps.version.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Update the cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/ffferitkartalll/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i.bak 's/^\( *version \)".*"/\1"${{ steps.version.outputs.version }}"/' casks/paneflipapp.rb
          rm casks/paneflipapp.rb.bak
          git diff --quiet && { echo "The cask has this version already."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update paneflipapp to ${{ steps.version.outputs.version }}"
          git push
