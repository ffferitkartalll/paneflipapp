name: Release

# A release is started by hand by pushing the tag `v<version>` on a commit of main, once the version was raised in
# macos/project.yml (`git tag v1.2.3 && git push origin v1.2.3`). Nothing runs for a pull request. A push event, unlike a
# manual run, shows its result (the green tick) next to the commit on the repository page. The tests run first on the tagged
# commit, then the release is built, signed and published. The tag must name MARKETING_VERSION; a version that already has a
# release, or a commit that is not on main, stops the job. A failed run is run again from Actions (Re-run).
# Its notes list the issues the merged pull requests closed (not the pull requests), made in the step before Publish: the issues
# labelled `highlight` (the big new feature that raised the second number of the version) come first, with the first paragraph of
# their description.
# Last, the cask in ffferitkartalll/homebrew-tap gets the new version and the notes (its caveats, which `brew upgrade` shows; the
# commit message of the tap carries them too) (secret TAP_TOKEN: contents write on that repository).
on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: xcode-27
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Stop before the tests when the tag is not a release of main with a new version.
      - name: Tag is a new version on main
        working-directory: macos
        run: |
          version="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml | head -1)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "The tag $GITHUB_REF_NAME is not v$version, the MARKETING_VERSION in macos/project.yml."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main."; exit 1; }
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version exists already: raise MARKETING_VERSION in macos/project.yml."
            exit 1
          fi

      - name: Bundle identifier
        working-directory: macos
        run: cp Config/Local.xcconfig.example Config/Local.xcconfig

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Core tests (no Xcode project needed)
        working-directory: macos
        run: swift test

      - name: App tests
        working-directory: macos
        run: |
          xcodegen generate
          # CI has no signing certificate: sign ad hoc, the tests never launch the app.
          xcodebuild test -project PaneFlip.xcodeproj -scheme PaneFlip -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO

  release:
    needs: test
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Version
        id: version
        working-directory: macos
        run: |
          version="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml | head -1)"
          [ -n "$version" ] || { echo "No MARKETING_VERSION in project.yml"; exit 1; }
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version exists already: raise MARKETING_VERSION in macos/project.yml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bundle identifier
        working-directory: macos
        run: |
          echo "PANEFLIP_BUNDLE_ID = ${{ vars.PANEFLIP_BUNDLE_ID }}" > Config/Local.xcconfig

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        working-directory: macos
        run: |
          xcodegen generate
          # Signed afterwards with the release certificate (next steps): the build itself does not sign.
          xcodebuild build -project PaneFlip.xcodeproj -scheme PaneFlip -configuration Release \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Import the signing certificate
        env:
          RELEASE_CERT_P12: ${{ secrets.RELEASE_CERT_P12 }}
          RELEASE_CERT_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$RELEASE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$RELEASE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          rm "$RUNNER_TEMP/release.p12"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign and pack
        run: |
          app="$RUNNER_TEMP/build/Build/Products/Release/PaneFlip.app"
          # The same certificate for every release keeps the app's identity, so the permissions macOS gave it stay.
          codesign --force --sign "PaneFlip Release" --keychain "$KEYCHAIN" "$app"
          codesign --verify --strict "$app"
          mkdir "$RUNNER_TEMP/dmg"
          cp -R "$app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname PaneFlip -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO \
            "PaneFlip-${{ steps.version.outputs.version }}.dmg"

      - name: Release notes
        run: |
          previous="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')"
          repo="${{ github.repository }}"
          version="${{ steps.version.outputs.version }}"
          # The pull requests merged since the previous release: each squash commit's first line ends with (#number).
          numbers="$(gh api "repos/$repo/compare/$previous...${{ github.sha }}" --paginate \
            --jq '.commits[].commit.message | split("\n")[0] | capture("\\(#(?<n>[0-9]+)\\)$").n')"
          # The issues those pull requests closed, except those of a release pull request, the documentation-only ones and the ones
          # labelled internal. A line each: number, whether it is a highlight, title, first paragraph of the description.
          for number in $numbers; do
            gh api graphql -f owner="${repo%/*}" -f name="${repo#*/}" -F number="$number" -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    labels(first: 20) { nodes { name } }
                    closingIssuesReferences(first: 50) { nodes { number title body labels(first: 20) { nodes { name } } } }
                  }
                }
              }' --jq '.data.repository.pullRequest
                | select(([.labels.nodes[].name] | index("release")) == null)
                | .closingIssuesReferences.nodes[]
                | select([.labels.nodes[].name] != ["documentation"] and (.labels.nodes | map(.name) | index("internal")) == null)
                | "\(.number)\t\(if (.labels.nodes | map(.name) | index("highlight")) != null then "highlight" else "-" end)\t\(.title)\t\(.body | gsub("\r"; "") | split("\n\n")[0] | gsub("\n"; " "))"'
          done | sort -n -u > "$RUNNER_TEMP/issues.tsv"
          {
            if awk -F'\t' '$2 == "highlight" { found = 1 } END { exit !found }' "$RUNNER_TEMP/issues.tsv"; then
              echo "## Highlight"
              echo
              awk -F'\t' '$2 == "highlight" { printf "### %s (#%s)\n\n%s\n\n", $3, $1, $4 }' "$RUNNER_TEMP/issues.tsv"
            fi
            echo "## What's new"
            echo
            if awk -F'\t' '$2 != "highlight" { found = 1 } END { exit !found }' "$RUNNER_TEMP/issues.tsv"; then
              awk -F'\t' '$2 != "highlight" { printf "* %s (#%s)\n", $3, $1 }' "$RUNNER_TEMP/issues.tsv"
            else
              echo "* Small fixes and improvements."
            fi
            echo
            echo "**Full Changelog**: https://github.com/$repo/compare/$previous...v$version"
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish
        run: |
          gh release create "v${{ steps.version.outputs.version }}" "PaneFlip-${{ steps.version.outputs.version }}.dmg" \
            --verify-tag \
            --title "PaneFlip ${{ steps.version.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Update the cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/ffferitkartalll/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i.bak 's/^\( *version \)".*"/\1"${{ steps.version.outputs.version }}"/' casks/paneflipapp.rb
          rm casks/paneflipapp.rb.bak
          # The notes of the release go in the caveats of the cask, which `brew install` and `brew upgrade` show: between two marker lines,
          # replaced at every release. Headings and the changelog link are left out; the heredoc is quoted, so nothing in it is interpreted.
          awk '/# BEGIN release notes/ { skip = 1 } !skip { print } /# END release notes/ { skip = 0 }' casks/paneflipapp.rb > "$RUNNER_TEMP/cask.rb"
          {
            echo "  # BEGIN release notes (written by the Release workflow of the app)"
            echo "  caveats <<~'EOS'"
            { echo "What's new in PaneFlip ${{ steps.version.outputs.version }}:"; echo; grep -v '^\*\*Full Changelog' "$RUNNER_TEMP/notes.md" | sed -e 's/^## .*//' -e 's/^### //'; } | cat -s | sed -e '/^$/!s/^/    /'
            echo "  EOS"
            echo "  # END release notes"
            echo
          } > "$RUNNER_TEMP/caveats.rb"
          # Before the `zap` stanza.
          awk -v file="$RUNNER_TEMP/caveats.rb" '/^ *zap / { while ((getline line < file) > 0) print line } { print }' "$RUNNER_TEMP/cask.rb" > casks/paneflipapp.rb
          git diff --quiet && { echo "The cask has this version already."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "Update paneflipapp to ${{ steps.version.outputs.version }}"; echo; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/commit.txt"
          git commit -aqF "$RUNNER_TEMP/commit.txt"
          git push
