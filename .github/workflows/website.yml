name: Website

# The page in `website/` goes to GitHub Pages (https://ffferitkartalll.github.io/paneflipapp/) only when a change to a file in
# `website/` lands on main: no other change, and no pull request, starts it. Pages is set to deploy from GitHub Actions in the
# repository settings. A failed run is run again from Actions (Re-run).
on:
  push:
    branches: [main]
    paths: ['website/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
