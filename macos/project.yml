# Source of truth for the Xcode project. Generate PaneFlip.xcodeproj with:  xcodegen generate
name: PaneFlip

options:
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

packages:
  PaneFlip:
    path: .

# The bundle identifier is yours: it comes from Config/Local.xcconfig, which is not in the repository
# (copy Config/Local.xcconfig.example and set PANEFLIP_BUNDLE_ID).
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"

targets:
  PaneFlip:
    type: application
    platform: macOS
    sources:
      - path: Sources/PaneFlip
    dependencies:
      - package: PaneFlip
        product: PaneFlipCore
    settings:
      base:
        PRODUCT_NAME: PaneFlip
        PRODUCT_BUNDLE_IDENTIFIER: $(PANEFLIP_BUNDLE_ID)
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Resources/AppIcon.icon (Icon Composer)

        # Info.plist is generated from these keys.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PaneFlip
        INFOPLIST_KEY_LSUIElement: YES            # menu bar app: no Dock icon, no menu bar of its own
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

        # User-facing strings live in Resources/Localizable.xcstrings.
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO

        # Managing other apps' windows through Accessibility is not possible inside the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

        # Signed with a local self-signed certificate (create it once: scripts/setup-local-signing.sh), so the
        # identity is the same on every build and the Accessibility permission survives rebuilds. Ad-hoc ("-")
        # would change it each time. With a developer account, set DEVELOPMENT_TEAM and its identity instead.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "PaneFlip Local Development"
        CODE_SIGNING_ALLOWED: YES

  # Logic tests of the app layer. The app is not launched: the tests compile the services and the ports they use
  # directly and drive them with fakes (Tests/PaneFlipTests/Fakes).
  PaneFlipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PaneFlipTests
      - path: Sources/PaneFlip/Stacks
      - path: Sources/PaneFlip/Platform/WindowSystem.swift
      - path: Sources/PaneFlip/Platform/WindowRef.swift
      - path: Sources/PaneFlip/Platform/AppCatalog.swift
      - path: Sources/PaneFlip/Platform/DockArea.swift
      - path: Sources/PaneFlip/Zones/LayoutService.swift
      - path: Sources/PaneFlip/Zones/LayoutManaging.swift
      - path: Sources/PaneFlip/Zones/DisplayChangeHandling.swift
      - path: Sources/PaneFlip/Zones/ZonePresenting.swift
      - path: Sources/PaneFlip/Pill/PillPresenter.swift
      - path: Sources/PaneFlip/Pill/DoubleTapDetector.swift
      - path: Sources/PaneFlip/Platform/UserDefaultsSettingsStorage.swift
      - path: Sources/PaneFlip/Zones/LayoutAppsEditing.swift
      - path: Sources/PaneFlip/Zones/LayoutAppEntry.swift
      - path: Sources/PaneFlip/Zones/ZoneRefreshing.swift
      - path: Sources/PaneFlip/Platform/AppInfo.swift
      - path: Sources/PaneFlip/Platform/ScreenProviding.swift
      - path: Sources/PaneFlip/Platform/ScreenInfo.swift
      - path: Sources/PaneFlip/Platform/JSONFileStore.swift
      - path: Sources/PaneFlip/Pill/PillMetrics.swift
      - path: Sources/PaneFlip/Platform/CDNBrandGlyphs.swift
      - path: Sources/PaneFlip/Platform/SVGArcFlags.swift
      - path: Sources/PaneFlip/Pill/IconFont.swift
      - path: Sources/PaneFlip/Settings/ReorderPlace.swift
      - path: Sources/PaneFlip/Pill/PillPanel.swift
      - path: Sources/PaneFlip/Platform/BrandGlyphSource.swift
      - path: Sources/PaneFlip/Settings/AppLanguages.swift
    dependencies:
      - package: PaneFlip
        product: PaneFlipCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PANEFLIP_BUNDLE_ID).tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"

schemes:
  PaneFlip:
    build:
      targets:
        PaneFlip: all
        PaneFlipTests: [test]
    test:
      targets:
        - PaneFlipTests
    run:
      config: Debug
    profile:
      config: Release
